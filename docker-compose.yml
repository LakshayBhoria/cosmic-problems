version: '3.9'

services:
  backend:
    build: ./backend
    container_name: cosmic-problems-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: cosmic-problems-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
